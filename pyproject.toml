[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "adlife-sim"
version = "0.1.0"
description = "A local-first synthetic consumer society and advertising simulation CLI"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "AGPL-3.0-only"
keywords = ["agent-based-modeling", "simulation", "synthetic-audience", "advertising"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "mesa>=3,<4",
  "networkx>=3.3,<4",
  "pandas>=2.2,<3",
  "platformdirs>=4.3,<5",
  "plotly>=5.24,<7",
  "pydantic>=2.9,<3",
  "pyyaml>=6.0,<7",
  "scipy>=1.14,<2",
  "textual>=1",
  "typer>=0.16,<1",
]

[project.scripts]
adlife = "adlife.cli.app:main"

[dependency-groups]
dev = [
  "hypothesis>=6.112",
  "mypy>=1.11",
  "pyinstaller>=6.10",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.7",
  "types-pyyaml>=6.0",
]
packaging = [
  "pyinstaller>=6.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/adlife"]

[tool.hatch.build]
include = [
  "src/adlife/**/*.py",
  "src/adlife/**/*.yaml",
  "src/adlife/**/*.j2",
  "src/adlife/**/*.css",
  "src/adlife/**/*.tcss",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["adlife"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["adlife"]
