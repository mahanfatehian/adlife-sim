name: Release

# Protected release pipeline. Trigger: signed annotated tags matching vX.Y.Z only.
# Every step verifies before anything is published; the public GitHub release is
# published only after all artifacts, checksums, SBOM, and PyPI publication succeed.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  verify-tag:
    name: verify signed tag == project version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_object_sha: ${{ steps.tag.outputs.tag_object_sha }}
      tag_commit_sha: ${{ steps.tag.outputs.tag_commit_sha }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Require an annotated, signed tag
        id: tag
        run: |
          set -euo pipefail
          TAG_REF="refs/tags/${GITHUB_REF_NAME}"
          git fetch --force origin "${TAG_REF}:${TAG_REF}"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          TYPE="$(git cat-file -t "${TAG_REF}")"
          [ "$TYPE" = "tag" ] || { echo "refusing: ${GITHUB_REF_NAME} is not an annotated tag ($TYPE)"; exit 1; }
          TAG_COMMIT="$(git rev-parse "${TAG_REF}^{commit}")"
          TAG_OBJECT_SHA="$(git rev-parse "${TAG_REF}")"
          EVENT_COMMIT="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          [ "$TAG_COMMIT" = "$EVENT_COMMIT" ] || { echo "refusing: tag no longer identifies the triggering commit"; exit 1; }
          git merge-base --is-ancestor "$TAG_COMMIT" refs/remotes/origin/main || { echo "refusing: tagged commit is not in main"; exit 1; }
          git verify-tag "${TAG_REF}" || { echo "refusing: tag signature is not trusted by the runner (a pinned release public key is required)"; exit 1; }
          echo "tag_object_sha=$TAG_OBJECT_SHA" >> "$GITHUB_OUTPUT"
          echo "tag_commit_sha=$TAG_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Compare tag with project version
        id: version
        run: |
          PROJECT_VERSION="$(grep -m1 '^version' pyproject.toml | sed 's/version = "\(.*\)"/\1/')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "refusing: tag v$TAG_VERSION != project version $PROJECT_VERSION"
            exit 1
          fi
          echo "version=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"

  quality-gates:
    name: full CI gates for tagged commit
    needs: verify-tag
    uses: ./.github/workflows/ci.yml

  build-native:
    name: frozen binary (${{ matrix.asset }})
    needs: [verify-tag, quality-gates]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x86_64
            archive: tar.gz
          - os: macos-15-intel
            asset: macos-x86_64
            archive: tar.gz
          - os: macos-latest
            asset: macos-aarch64
            archive: tar.gz
          - os: windows-latest
            asset: windows-x86_64
            archive: zip
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # astral-sh/setup-uv v10.2.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.14"
          python-version: "3.12.11"
      - name: Install locked dependencies (packaging group included)
        run: uv sync --locked --all-groups
      - name: Build the frozen application
        run: uv run pyinstaller packaging/adlife.spec --clean --noconfirm
      - name: Smoke-test the exact frozen artifact on its builder
        shell: bash
        run: |
          EXE="dist/adlife/adlife"
          [ -x "$EXE" ] || EXE="dist/adlife/adlife.exe"
          "$EXE" --version
          "$EXE" doctor --offline
          "$EXE" --format json city-catalog list
          "$EXE" --format json city-catalog show fictional-grid-v2
          "$EXE" --format json city-run --city-id fictional-grid-v2 --output-root frozen-city-output --run-id catalog-frozen --agents 2 --days 1 --seed 42
          "$EXE" --format json city-replay frozen-city-output catalog-frozen
          "$EXE" init frozen-smoke
          "$EXE" run frozen-smoke --run-id frozen --mode rules --days 1 --population-size 2 --headless
          "$EXE" report frozen-smoke frozen
          test -s frozen-smoke/reports/frozen.html
      - name: Package the release asset
        shell: bash
        run: |
          VERSION="${{ needs.verify-tag.outputs.version }}"
          NAME="adlife-v${VERSION}-${{ matrix.asset }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && 7z a -tzip "${NAME}.zip" adlife)
          else
            tar -czf "dist/${NAME}.tar.gz" -C dist adlife
          fi
          echo "ASSET=dist/adlife-v${VERSION}-${{ matrix.asset }}.${{ matrix.archive }}" >> "$GITHUB_ENV"
      # actions/upload-artifact v6.0.0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: frozen-${{ matrix.asset }}
          path: ${{ env.ASSET }}
          retention-days: 7
          if-no-files-found: error

  assemble-release:
    name: checksums, SBOM, and license report
    needs: [verify-tag, build-native]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.2.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.14"
          python-version: "3.12.11"
      # actions/download-artifact v6.0.0
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          pattern: frozen-*
          path: assets
          merge-multiple: true
      - name: Install locked release toolchain
        run: uv sync --locked --all-groups
      - name: Build wheel and sdist
        run: uv build --no-sources --no-build-isolation
      - name: Smoke-test the exact wheel
        run: uv run python scripts/smoke_release.py dist/adlife_sim-*.whl
      - name: SBOM and third-party license report
        run: |
          uv run --locked cyclonedx-py environment .venv/bin/python --output-file assets/sbom.cdx.json --output-format JSON
          uv run --locked pip-licenses --format=json --output-file=assets/third-party-licenses.json
      - name: Generate SHA256SUMS for every release file
        shell: bash
        run: |
          cp dist/adlife_sim-*.whl dist/adlife_sim-*.tar.gz assets/
          cd assets
          sha256sum --binary * > SHA256SUMS
          sha256sum --check SHA256SUMS
      # actions/upload-artifact v6.0.0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: verified-distributions
          path: dist/
          if-no-files-found: error
      # actions/upload-artifact v6.0.0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: verified-release-assets
          path: assets/
          if-no-files-found: error

  create-draft-release:
    name: create the draft GitHub release
    needs: [verify-tag, assemble-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/download-artifact v6.0.0
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: verified-release-assets
          path: assets/
      - name: Create the draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
          EXPECTED_TAG_OBJECT: ${{ needs.verify-tag.outputs.tag_object_sha }}
          EXPECTED_TAG_COMMIT: ${{ needs.verify-tag.outputs.tag_commit_sha }}
        run: |
          set -euo pipefail
          TAG_REF="refs/tags/${GITHUB_REF_NAME}"
          REMOTE_TAG_OBJECT="$(git ls-remote --exit-code --refs origin "$TAG_REF" | awk 'NR == 1 { print $1 }')"
          [ "$REMOTE_TAG_OBJECT" = "$EXPECTED_TAG_OBJECT" ] || { echo "refusing: release tag changed after verification"; exit 1; }
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "$EXPECTED_TAG_COMMIT" refs/remotes/origin/main || { echo "refusing: verified release commit is no longer in main"; exit 1; }
          gh release create "v${VERSION}" \
            --draft --verify-tag --title "AdLife Lab v${VERSION}" \
            --notes "See CHANGELOG.md for the release notes. Verify downloads against SHA256SUMS." \
            assets/*

  publish-pypi:
    name: PyPI (Trusted Publishing)
    needs: [verify-tag, create-draft-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Trusted Publishing: OIDC, no stored PyPI token
    environment:
      name: pypi
      url: https://pypi.org/p/adlife-sim
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/download-artifact v6.0.0
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: verified-distributions
          path: dist/
      - name: Recheck release provenance before PyPI publication
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.verify-tag.outputs.tag_object_sha }}
          EXPECTED_TAG_COMMIT: ${{ needs.verify-tag.outputs.tag_commit_sha }}
        run: |
          set -euo pipefail
          TAG_REF="refs/tags/${GITHUB_REF_NAME}"
          REMOTE_TAG_OBJECT="$(git ls-remote --exit-code --refs origin "$TAG_REF" | awk 'NR == 1 { print $1 }')"
          [ "$REMOTE_TAG_OBJECT" = "$EXPECTED_TAG_OBJECT" ] || { echo "refusing: release tag changed after verification"; exit 1; }
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "$EXPECTED_TAG_COMMIT" refs/remotes/origin/main || { echo "refusing: verified release commit is no longer in main"; exit 1; }
      # pypa/gh-action-pypi-publish v1.13.0
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e

  publish-release:
    name: publish the GitHub release
    needs: [verify-tag, create-draft-release, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
          EXPECTED_TAG_OBJECT: ${{ needs.verify-tag.outputs.tag_object_sha }}
          EXPECTED_TAG_COMMIT: ${{ needs.verify-tag.outputs.tag_commit_sha }}
        run: |
          set -euo pipefail
          TAG_REF="refs/tags/${GITHUB_REF_NAME}"
          REMOTE_TAG_OBJECT="$(git ls-remote --exit-code --refs origin "$TAG_REF" | awk 'NR == 1 { print $1 }')"
          [ "$REMOTE_TAG_OBJECT" = "$EXPECTED_TAG_OBJECT" ] || { echo "refusing: release tag changed after verification"; exit 1; }
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "$EXPECTED_TAG_COMMIT" refs/remotes/origin/main || { echo "refusing: verified release commit is no longer in main"; exit 1; }
          gh release edit "v${VERSION}" --verify-tag --draft=false
