name: Quick checks

# Every push to main gets fast feedback: lint, types, shell-script lint, the wheel smoke, the
# dependency and secret scans, and every test file except the two performance benchmarks and
# the long guided browser workload, split into parallel Linux shards without coverage. The
# full CI (ci.yml) adds the Python 3.11-3.13, Windows and macOS matrix, the coverage floor,
# the performance gates and the long guided browser workload, for pull requests, releases, a
# weekly run and manual runs.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quick-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # astral-sh/setup-uv v10.2.0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Mypy strict
        run: |
          uv run mypy src
          uv run mypy --platform linux src
          uv run mypy --platform win32 src

  tests:
    name: tests (shard ${{ matrix.shard }} of 6)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # astral-sh/setup-uv v10.2.0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Test shard
        env:
          # The two performance benchmarks and the long guided browser workload stay in the
          # full CI, which runs them on their own runners outside coverage.
          ADLIFE_SKIP_LONG_TESTS: "1"
          # Browser regressions are a required gate here too, never an environment skip.
          ADLIFE_REQUIRE_BROWSER: "1"
        # Every test file lands in exactly one shard (scripts/ci_test_shards.py).
        run: |
          uv run python scripts/ci_test_shards.py ${{ matrix.shard }} 6 > shard.txt
          uv run pytest -q --junitxml=junit.xml $(cat shard.txt)
      # The measured times keep the shards balanced; they are refreshed by hand from all six
      # reports of one complete run (ci_test_shards.py --measure).
      # actions/upload-artifact v6.0.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: junit-${{ matrix.shard }}
          path: junit.xml
          retention-days: 7

  shell-quality:
    name: shell script quality
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: ShellCheck
        run: |
          shellcheck --version
          find scripts -name '*.sh' -print0 | xargs -0 -n1 shellcheck --severity=style
      - name: PowerShell Script Analyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force
          Invoke-ScriptAnalyzer -Path scripts -Recurse -EnableExit -Severity Warning

  build:
    name: wheel build + clean-room smoke
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # astral-sh/setup-uv v10.2.0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - name: Build wheel and sdist
        run: uv build --no-sources
      - name: Clean-room smoke of the exact wheel
        run: uv run python scripts/smoke_release.py dist/adlife_sim-*.whl
      # actions/upload-artifact v6.0.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: distributions
          path: dist/
          retention-days: 7

  security:
    name: dependency + secret scan
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # astral-sh/setup-uv v10.2.0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - name: Dependency audit
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file requirements-audit.txt
          uv tool run pip-audit --requirement requirements-audit.txt --no-deps --disable-pip
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
