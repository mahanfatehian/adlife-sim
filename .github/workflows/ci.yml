name: CI

# The full CI: the quick checks' lint, types, shell-script lint, wheel smoke and scans, plus
# Python 3.11-3.13 on Linux and 3.12 on Windows and macOS, the 85% coverage floor, the
# performance gates and the long guided browser workload. It runs for pull requests, for
# every release (release.yml calls it for the tagged commit), weekly, and on demand from the
# Actions tab; each push to main gets only the quick checks in quick.yml, which run every
# test file except the two performance benchmarks and the long guided browser workload.

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  schedule:
    # Mondays at 03:17 UTC.
    - cron: "17 3 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Fail the coverage floor the same way the local suite does.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # astral-sh/setup-uv v10.2.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Mypy strict
        run: |
          uv run mypy src
          uv run mypy --platform linux src
          uv run mypy --platform win32 src
      - name: Test suite with branch coverage (85% floor)
        env:
          # Run the timing-sensitive benchmark separately from coverage instrumentation.
          ADLIFE_SKIP_LONG_TESTS: "1"
          # Browser regressions are a required CI gate, never an environment-dependent skip.
          ADLIFE_REQUIRE_BROWSER: "1"
        run: uv run pytest -q --cov=adlife --cov-branch
      - name: Long guided browser workloads
        env:
          # The full live-answer guided flow is timing-sensitive under coverage
          # tracing but remains a required, real-browser CI gate.
          ADLIFE_REQUIRE_BROWSER: "1"
        run: uv run pytest -q -s tests/browser/test_guide_setup_browser.py::test_online_ai_stops_at_the_key_prompt_then_counts_answers_live
      - name: Offline deterministic integration runs
        run: |
          uv run pytest -q tests/integration/test_rule_run.py tests/integration/test_demo.py
      - name: Textual application smoke (pilot-driven run_test)
        run: uv run pytest -q tests/tui

  performance:
    name: performance (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # astral-sh/setup-uv v10.2.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Maximum rules performance
        env:
          # This hosted-Windows regression ceiling absorbs measured shared-runner noise;
          # it does not replace the benchmark's 10-second product target.
          ADLIFE_PERF_CEILING_SECONDS: ${{ runner.os == 'Windows' && '120' || '' }}
        run: uv run pytest -q -s tests/integration/test_maximum_run.py
      - name: Maximum spatial opportunity performance
        env:
          # Keep the spatial ceiling meaningful while allowing shared Windows host noise.
          ADLIFE_SPATIAL_PERF_CEILING_SECONDS: ${{ runner.os == 'Windows' && '60' || '' }}
        run: uv run pytest -q -s tests/integration/test_spatial_opportunity_performance.py

  shell-quality:
    name: shell script quality
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: ShellCheck
        run: |
          shellcheck --version
          find scripts -name '*.sh' -print0 | xargs -0 -n1 shellcheck --severity=style
      - name: PowerShell Script Analyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force
          Invoke-ScriptAnalyzer -Path scripts -Recurse -EnableExit -Severity Warning

  build:
    name: wheel build + clean-room smoke
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # astral-sh/setup-uv v10.2.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - name: Build wheel and sdist
        run: uv build --no-sources
      - name: Clean-room smoke of the exact wheel
        run: uv run python scripts/smoke_release.py dist/adlife_sim-*.whl
      # actions/upload-artifact v6.0.0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: distributions
          path: dist/
          retention-days: 7

  security:
    name: dependency + secret scan
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # astral-sh/setup-uv v10.2.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - name: Dependency audit
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file requirements-audit.txt
          uv tool run pip-audit --requirement requirements-audit.txt --no-deps --disable-pip
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
